- contents:
  - git:
      commitTitle: 'The package carries the resource region: build.py puts NAME-res.bin
        into the .fwsc (fm1pkg_make.py --res: an entry of type 101, the region''s
        address from app.h''s APP_RES_BASE at byte 0x14), and felucca-bsp''s update
        loader writes it after the app, so an install from a host that sends only
        the package (The Firmware Hub, M-UPGRADE) has the app''s resources; device/res.c
        checks the address is the one the app reads. NAME-res.bin stays beside the
        package for the host''s own write (fm1_resources.py, the installer page: a
        region there already answers at once). bsp: felucca-bsp 18eadad'
      sha: c8e05997ce970875038156d2bbd69e712eac1543
    path: .
