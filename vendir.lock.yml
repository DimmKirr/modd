    git:
      commitTitle: 'SLOOP 2.8.5: FM-1 units with the UC25HQ80 flash (JEDEC 0xB36014,
        sold from late 2026, mostly AliExpress) were taken for an unknown chip: projects
        stayed in RAM (flash error) and the update loader refused to install. The
        app, the USB rescue and the update loader now know both parts (fm1_flash_id.h:
        the Puya P25Q80 0x856014 and the UC25HQ80 0xB36014, the same size and commands);
        the recovery test checks both and refuses any other. Thanks to Sven (The Firmware
        Hub) for the heads-up'
      sha: bac9c05ea7627449405aa10e48da21d75b6c8c56
      tags:
      - v2.8.5
    path: .
