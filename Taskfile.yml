version: '3'

dotenv: ['.env']

includes:
  fm1-platform:
    taskfile: https://raw.githubusercontent.com/DimmKirr/setup-fm1-toolchain/v1/Taskfile.yml
  fm1-emulator:
    taskfile: https://raw.githubusercontent.com/DimmKirr/setup-fm1-emulator/v1/Taskfile.yml
    vars:
      FM1_VERSION: v0.3.0
      FM1_SOURCE_REPO: DimmKirr/fm1-emu
  vendor:
    taskfile: firmware/upstream/Taskfile.yml
    dir: '{{.ROOT_DIR}}'
  modd:
    taskfile: configs/Taskfile.yml
    dir: '{{.ROOT_DIR}}'
  debug:wifi:
    taskfile: .scratch/Taskfile.yml
    optional: true
    dir: '{{.ROOT_DIR}}'

env:
  # The default reaches every command: build.py, the test fixtures and the screenshot generator
  # read USE_OPEN_TOOLCHAIN themselves (1 = open toolchain). A value set in the shell wins.
  USE_OPEN_TOOLCHAIN: '{{.USE_OPEN}}'

vars:
  # Hardware builds use JieLi clang 4.0.1 by default and write to build/<defconfig>/.
  # USE_OPEN_TOOLCHAIN=1 selects the open pi32v2 LLVM toolchain and build/<defconfig>-open/.
  # Emulator tasks (modd_emu) override this to open in configs/Taskfile.yml.
  # A shell env var always wins: USE_OPEN_TOOLCHAIN=1 task build  forces open.
  # TC_SUFFIX is appended to every build/<defconfig> path below.
  # configs/Taskfile.yml repeats this expression and, being included, its copy is the one in
  # effect for per-defconfig tasks: change both.
  USE_OPEN: '{{if eq (env "USE_OPEN_TOOLCHAIN") "1"}}1{{else}}0{{end}}'
  TC_SUFFIX: '{{if eq .USE_OPEN "1"}}-open{{end}}'
  # The one place the open toolchain release is pinned (release tag; the version is the tag minus "pi32v2-").
  OPEN_TOOLCHAIN_VERSION: pi32v2-23.1.5-5
  # Install root (contains bin/clang); the OPEN_TOOLCHAIN environment variable overrides it.
  OPEN_TOOLCHAIN_DIR: '{{env "OPEN_TOOLCHAIN" | default (printf "%s/.fm1-toolchain/open/%s" .HOME .OPEN_TOOLCHAIN_VERSION)}}'
  BUILD_DIR: 'build/modd{{.TC_SUFFIX}}'
  FM1_EMU_ROOT: '{{env "FM1_EMU_ROOT" | default "/Users/dmitry/dev/modd-fm/fm1-emu/.worktrees/master"}}'
  FM1_EMU_BIN: '{{.FM1_EMU_ROOT}}/target/release'
  FM1_WEB_DIR: '{{env "FM1_WEB_DIR" | default (printf "%s/_site" .FM1_EMU_ROOT)}}'

tasks:
  build:
    desc: Build modd firmware (alias for build:live)
    cmds:
      - task: build:live
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  build:live:
    desc: Generate config.h and compile firmware (skipped when sources and .env are unchanged since this defconfig was last built)
    # One checksum per defconfig: the label names the fingerprint file under .task/checksum/, and
    # generates points at that defconfig's package. Without them, building one defconfig made
    # every other one "up to date" while its build/<defconfig>/modd.fwsc was still old.
    label: 'build:live:{{.DEFCONFIG}}{{._TC}}'
    # The JieLi SDK stays a dependency in both modes: build.py takes one object out of its cpu.a.
    deps:
      - fm1-platform:download:sdk
      - fm1-platform:download:toolchain
      - vendor:ensure
      # Applies patches/<upstream>/*.patch to a copy in this build's gen/ dir (runs after vendor:ensure:
      # vendor:patch depends on it). One copy per defconfig and toolchain, like the checksum below.
      - task: vendor:patch
        vars: { DEFCONFIG: '{{.DEFCONFIG}}', OUT: 'build/{{.DEFCONFIG}}{{._TC}}' }
      - task: toolchain:open:ensure
        vars: { OPEN: '{{.OPEN}}' }
    vars:
      # The defconfig this run builds: the name after --defconfig in the arguments
      # ("--defconfig name" or "--defconfig=name"), modd when there is none (.config).
      DEFCONFIG: '{{regexReplaceAll "^--defconfig[= ]+" (regexFind "--defconfig[= ]+[A-Za-z0-9_.-]+" .CLI_ARGS) "" | default "modd"}}'
      # The toolchain of this build: OPEN (1 or 0) when the calling task passes it (the emulator
      # tasks in configs/Taskfile.yml pass 1), otherwise the shell's USE_OPEN_TOOLCHAIN. A calling
      # task's env block does not reach this task, so the choice has to arrive as a variable.
      # _TC keeps the open toolchain's checksum and package apart from JieLi's.
      _OPEN: '{{.OPEN | default .USE_OPEN}}'
      _TC: '{{if eq ._OPEN "1"}}-open{{end}}'
    env:
      JIELI_TOOLCHAIN: '{{env "JIELI_TOOLCHAIN" | default (printf "%s/.fm1-toolchain/toolchain" .HOME)}}'
      AC79_SDK: '{{env "AC79_SDK" | default (printf "%s/.fm1-toolchain/AC79_SDK" .HOME)}}'
      OPEN_TOOLCHAIN: '{{.OPEN_TOOLCHAIN_DIR}}'
      ALLOW_NONFREE: '{{env "ALLOW_NONFREE" | default ""}}'
    sources:
      - firmware/**/*
      - tools/build/build.py
      - tools/build/patches.py
      - patches/**/*.patch
      - tools/build/genconfig.py
      - tools/codegen/logo_convert.py
      - tools/codegen/gen_engine_tables.py
      - tools/codegen/gen_openapi.py
      - docs/api/openapi.overlay.yaml
      - kconf/**/*
      - configs/**/*
      - assets/**/*
      - Kconfig
      - .config
      - .env
    generates:
      - 'build/{{.DEFCONFIG}}{{._TC}}/modd.fwsc'
    method: checksum
    preconditions:
      # The Taskfile's paths and build.py must agree on the toolchain; only 0 and 1 mean something.
      - sh: 'case "$USE_OPEN_TOOLCHAIN" in 0|1) ;; *) exit 1;; esac'
        msg: "USE_OPEN_TOOLCHAIN must be 1 (open toolchain, the default), 0 (JieLi) or unset."
      # A value given after the task name (task build USE_OPEN_TOOLCHAIN=0) reaches the templates but
      # not the environment build.py reads: refuse it instead of building with the other toolchain.
      - sh: 'test "{{.USE_OPEN_TOOLCHAIN | default .USE_OPEN}}" = "$USE_OPEN_TOOLCHAIN"'
        msg: "Set USE_OPEN_TOOLCHAIN in the environment (USE_OPEN_TOOLCHAIN=0 task build), not after the task name."
    cmds:
      - USE_OPEN_TOOLCHAIN={{._OPEN}} uv run --quiet python tools/build/build.py {{.CLI_ARGS}}

  toolchain:open:ensure:
    desc: Internal. Installs the open toolchain unless the build is a JieLi one
    internal: true
    silent: true
    status:
      # Passes (task skipped) for a JieLi build: OPEN from build:live, else the shell's choice.
      - test "{{.OPEN | default .USE_OPEN}}" != 1
    cmds:
      - task: toolchain:open:download

  toolchain:open:download:
    desc: "Download the open pi32v2 LLVM toolchain (pinned release) into ~/.fm1-toolchain/open/<tag> (the default compiler; builds install it when missing)"
    vars:
      VER: '{{trimPrefix "pi32v2-" .OPEN_TOOLCHAIN_VERSION}}'
    env:
      OTC_TAG: '{{.OPEN_TOOLCHAIN_VERSION}}'
      OTC_VER: '{{trimPrefix "pi32v2-" .OPEN_TOOLCHAIN_VERSION}}'
      OTC_DEST: '{{.OPEN_TOOLCHAIN_DIR}}'
    status:
      - test -x '{{.OPEN_TOOLCHAIN_DIR}}/bin/clang'
      - grep -q 'pi32v2-llvm-{{.VER}}-' '{{.OPEN_TOOLCHAIN_DIR}}/VERSION'
    cmds:
      # Python, not tar -xJ: the container has no xz binary, and tarfile verifies/extracts everywhere.
      - |
        uv run --quiet python -I - <<'PY'
        import hashlib, os, platform, shutil, sys, tarfile, tempfile, urllib.request
        from pathlib import Path
        tag, ver, dest = os.environ['OTC_TAG'], os.environ['OTC_VER'], Path(os.environ['OTC_DEST'])
        osn = {'Linux': 'linux', 'Darwin': 'macos'}.get(platform.system())
        arch = {'x86_64': 'x64', 'amd64': 'x64', 'aarch64': 'arm64', 'arm64': 'arm64'}.get(platform.machine().lower())
        if not osn or not arch:
            sys.exit(f'no open toolchain build for {platform.system()} {platform.machine()}')
        name = f'pi32v2-llvm-{ver}-{osn}-{arch}'
        base = f'https://github.com/jvitkauskas/pi32v2-llvm/releases/download/{tag}'
        dest.parent.mkdir(parents=True, exist_ok=True)
        tmp = Path(tempfile.mkdtemp(prefix='otc-', dir=dest.parent))
        try:
            def get(url, to):
                with urllib.request.urlopen(url) as r, open(to, 'wb') as f:
                    shutil.copyfileobj(r, f)
            print(f'downloading {name}.tar.xz')
            get(f'{base}/{name}.tar.xz', tmp / 'a.tar.xz')
            get(f'{base}/SHA256SUMS', tmp / 'SHA256SUMS')
            want = next((l.split()[0] for l in (tmp / 'SHA256SUMS').read_text().splitlines()
                         if l.split()[-1:] == [f'{name}.tar.xz'] or l.split()[-1:] == [f'*{name}.tar.xz']), None)
            if not want:
                sys.exit(f'{name}.tar.xz not listed in SHA256SUMS')
            h = hashlib.sha256()
            with open(tmp / 'a.tar.xz', 'rb') as f:
                for chunk in iter(lambda: f.read(1 << 20), b''):
                    h.update(chunk)
            if h.hexdigest() != want:
                sys.exit(f'SHA256 mismatch for {name}.tar.xz: {h.hexdigest()} != {want}')
            ex = tmp / 'x'
            ex.mkdir()
            with tarfile.open(tmp / 'a.tar.xz') as t:
                t.extractall(ex, filter='data')
            top = ex / name
            if not (top / 'bin' / 'clang').exists():
                sys.exit(f'{name}/bin/clang missing in the archive')
            if dest.exists():
                shutil.rmtree(dest)
            top.rename(dest)
            print(f'installed {dest}')
        finally:
            shutil.rmtree(tmp, ignore_errors=True)
        PY
      - '{{.OPEN_TOOLCHAIN_DIR}}/bin/clang --version | head -1'

  build:dry-run:
    desc: Show what would be compiled without building
    cmds:
      - uv run --quiet python tools/build/build.py --dry-run

  test:
    desc: Run all tests (unit, then the direct-API tests in fm1-live)
    cmds:
      - task: test:unit
      - task: test:api

  test:unit:
    desc: Run Python unit tests (genconfig, defconfigs, tooling)
    deps: [vendor:ensure]
    cmds:
      # --tier unit leaves out the API tier (is_api_test in tests/conftest.py): it runs under test:api
      - uv run --quiet python -m pytest tests/ -v --tier unit {{.CLI_ARGS}}

  test:api:
    desc: Run the direct-API tests (Python drives the firmware over HTTP in fm1-live; modd_emu build)
    cmds:
      - task: modd:test:modd_emu:api
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  emulator:build:
    desc: Build WASM from a local fm1-emu checkout (requires the Rust WASM target)
    vars:
      EMU_SOURCE: '{{.EMU_SOURCE | default .FM1_EMU_ROOT}}'
    preconditions:
      - test -f '{{.EMU_SOURCE}}/web/build.sh'
    cmds:
      - bash '{{.EMU_SOURCE}}/web/build.sh' '{{.EMU_SOURCE}}/_site'

  flash:
    desc: "Build if needed, then flash firmware to FM-1 (default: USB-MIDI SysEx)"
    cmds:
      # "task flash OPEN_TOOLCHAIN_FLASH_OK=0": the value after the task name cannot switch the
      # global toolchain vars, so run again with it in the environment (JieLi build and image).
      - cmd: 'USE_OPEN_TOOLCHAIN=0 OPEN_TOOLCHAIN_FLASH_OK=0 "{{.TASK_EXE}}" flash{{if .FIRMWARE}} FIRMWARE={{.FIRMWARE}}{{end}}{{if .AUTO_APPROVE}} AUTO_APPROVE={{.AUTO_APPROVE}}{{end}}{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}'
        if: '{{if and (eq (.OPEN_TOOLCHAIN_FLASH_OK | default "") "0") (eq .USE_OPEN "1")}}true{{else}}false{{end}}'
      - task: flash:midi
        if: '{{if and (eq (.OPEN_TOOLCHAIN_FLASH_OK | default "") "0") (eq .USE_OPEN "1")}}false{{else}}true{{end}}'
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
          FIRMWARE: '{{.FIRMWARE | default ""}}'
          AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'

  flash:midi:
    desc: Flash firmware to FM-1 over USB-MIDI SysEx
    silent: true
    deps:
      - task: build
        vars: { CLI_ARGS: '' }   # flash's own -- args are for fm1_install.py, not build.py
    vars:
      FIRMWARE: '{{.FIRMWARE | default (printf "%s/modd.fwsc" .BUILD_DIR)}}'
      DEBUG: '{{.DEBUG | default "true"}}'
      AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found."
    cmds:
      - cmd: '{{if .TC_SUFFIX}}echo "note: flashing an image built with the open pi32v2 toolchain."{{else}}:{{end}}'
        silent: true
      - cmd: |
          test -f {{.BUILD_DIR}}/modd.version && echo "version: $(cat {{.BUILD_DIR}}/modd.version)" || true
      - task: build:size-check
        vars: { CLI_ARGS: '' }   # flash's -- args are fm1_install.py's
      - uv run --quiet --group flash python tools/device/fm1_install.py {{.FIRMWARE}} --force {{if eq .AUTO_APPROVE "true"}}--yes {{end}}{{.CLI_ARGS}}

  build:size-check:
    desc: "Show memory use from the last build: regions, budgets, stacks, largest objects (DEFCONFIG=name, -- -n N)"
    silent: true
    vars:
      DIR: '{{if .DEFCONFIG}}build/{{.DEFCONFIG}}{{.TC_SUFFIX}}{{else}}{{.BUILD_DIR}}{{end}}'
    preconditions:
      - sh: test -f {{.DIR}}/modd.map
        msg: "{{.DIR}}/modd.map not found. Run 'task build' first."
    cmds:
      # tools/build/mem_report.py, the report build.py prints after every link
      - uv run --quiet python tools/build/mem_report.py {{.DIR}} {{.CLI_ARGS}}

  build:size-top:
    desc: Rank the .data/.bss consumers from the linker map (default top 20; -- -n N)
    silent: true
    preconditions:
      - sh: test -f {{.BUILD_DIR}}/modd.map
        msg: "{{.BUILD_DIR}}/modd.map not found. Run 'task build' first."
    cmds:
      - uv run --quiet python tools/debug/ram_top.py {{.BUILD_DIR}}/modd.map {{.CLI_ARGS}}

  flash:uboot:
    desc: Flash firmware via UBOOT mode (hold OCT+/- for 5s, then run this)
    silent: true
    vars:
      FIRMWARE: '{{.FIRMWARE | default (printf "%s/modd.fwsc" .BUILD_DIR)}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found. Run 'task build' first."
    cmds:
      - cmd: '{{if .TC_SUFFIX}}echo "note: flashing an image built with the open pi32v2 toolchain."{{else}}:{{end}}'
        silent: true
      - cmd: |
          test -f {{.BUILD_DIR}}/modd.version && echo "version: $(cat {{.BUILD_DIR}}/modd.version)" || true
      - uv sync --quiet --group uboot
      - sudo uv run --quiet --group uboot python tools/device/fm1_uboot_flash.py {{.FIRMWARE}} {{.CLI_ARGS}}

  debug:flash:
    desc: Debug flash issues - list MIDI devices and retry update loader detection
    cmds:
      - mkdir -p .scratch/debug/logs
      - cmd: |
          LOG=".scratch/debug/logs/$(date -u +%Y-%m-%dT%H%M%SZ)-flash.log"
          {
          echo "# debug:flash $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=== MIDI devices ==="
          uv run --quiet --group flash python -c "
          import rtmidi
          mi = rtmidi.MidiIn()
          mo = rtmidi.MidiOut()
          print('IN: ', mi.get_ports())
          print('OUT:', mo.get_ports())
          "
          echo ""
          echo "=== Looking for FM-1 or Update Loader (10s) ==="
          uv run --quiet --group flash python -c "
          import rtmidi, time
          for i in range(20):
              mi = rtmidi.MidiIn()
              ports = mi.get_ports()
              for p in ports:
                  if 'FM-1' in p or 'Felucca' in p or 'Update' in p:
                      print(f'  found: {p}')
              if not any('FM-1' in p or 'Felucca' in p or 'Update' in p for p in ports):
                  print(f'  [{i*0.5:.1f}s] no FM-1 device')
              time.sleep(0.5)
          "
          echo ""
          echo "If 'Felucca Update' appeared, run: task flash"
          echo "If only 'FM-1' appeared, the device is in normal mode."
          echo "If nothing appeared, check USB cable."
          } 2>&1 | tee "$LOG"

  recover:download-stock-firmware:
    desc: Download official M-VAVE FM-1 stock firmware V15 (.fwsc)
    vars:
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    status:
      - test -f '{{.STOCK_FWSC}}'
    cmds:
      - mkdir -p build
      - curl -fL -o '{{.STOCK_FWSC}}' https://github.com/m-vave/fm1_open/raw/main/sdk/firmware/FM-1_015.fwsc
      - echo "Downloaded stock V15 firmware to {{.STOCK_FWSC}}"

  recover:transporter:rpi:flash:
    desc: Flash Transporter firmware onto a Raspberry Pi Pico (hold BOOTSEL, plug in, then run this)
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py setup --board pico_rp2040
      - uv run --quiet --group unbrick python fm1_transporter_recover.py flash-board --board pico_rp2040 {{.CLI_ARGS}}

  recover:transporter:fm1:unbrick:
    desc: Recover a hard-bricked FM-1 via Transporter (Pico wired to FM-1, no USB presence)
    deps: [recover:download-stock-firmware]
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py recover --board pico_rp2040 --v15 '{{.STOCK_FWSC}}' '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  recover:transporter:fm1:unbrick-soft:
    desc: Restore firmware via USB ROM boot mode (soft-bricked device)
    deps: [recover:download-stock-firmware]
    vars:
      UNBRICKER_DIR: '{{env "UNBRICKER_DIR" | default (printf "%s/.fm1-toolchain/unbricker" .HOME)}}'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    cmds:
      - |
        if [ ! -d "{{.UNBRICKER_DIR}}" ]; then
          echo "Cloning MvaveFM1Unbricker..."
          git clone --depth 1 https://github.com/Quixotic7/MvaveFM1Unbricker "{{.UNBRICKER_DIR}}"
        fi
      - uv run --quiet --group unbrick python "{{.UNBRICKER_DIR}}/fm1_unbrick.py" restore '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  # ---- Device debug tasks --------------------------------------------------
  # Each run saves to .scratch/debug/logs/<timestamp>-<name>.log with a
  # symlink at .scratch/debug/<name>.log. All talk to the FM-1 over
  # USB-MIDI SysEx (python-rtmidi). Specialized tasks (wl0, sweep, ind,
  # input) live in .scratch/Taskfile.yml under the debug:wifi: namespace.

  logs:debug:
    desc: "Dump build facts, crash record, log ring, and keep tailing (-- --no-follow to stop after dump)"
    silent: true
    cmds:
      - mkdir -p .scratch/debug/logs
      - |
        TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
        LOG=".scratch/debug/logs/${TS}-debug.log"
        NO_FOLLOW=false
        for arg in {{.CLI_ARGS}}; do
          [ "$arg" = "--no-follow" ] && NO_FOLLOW=true
        done
        {
          echo "=== logs:debug $(date -Iseconds) ==="
          # config.masked.h: config.h with the secret symbols masked (genconfig.py
          # SECRET_SYMBOLS). Never print config.h itself: this log gets shared.
          echo "=== config symbols (secrets masked) ==="
          if [ -f {{.BUILD_DIR}}/gen/config.masked.h ]; then
            grep '^#define CONFIG_' {{.BUILD_DIR}}/gen/config.masked.h
          else
            echo "(no config.masked.h: run task build)"
          fi
          echo ""
          echo "=== .bss/.pool sizes (from linker map) ==="
          grep -E '^\.(bss|pool)\b|_bss_(start|end)|_pool_(start|end)' {{.BUILD_DIR}}/modd.map 2>/dev/null
          echo ""
          echo "=== firmware size ==="
          ls -la {{.BUILD_DIR}}/modd.fwsc {{.BUILD_DIR}}/modd.elf 2>/dev/null
          echo ""
          echo "=== device status (crash record, ring position) ==="
          uv run --quiet --with python-rtmidi python tools/device/fm1log.py --hello 2>&1
          echo ""
          echo "=== DAP log buffer ==="
          if [ "$NO_FOLLOW" = "true" ]; then
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py 2>&1
          else
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py --follow 2>&1
          fi
        } | tee "$LOG"
        ln -sf "logs/${TS}-debug.log" .scratch/debug/debug.log
        echo "Log saved: .scratch/debug/logs/${TS}-debug.log"

  debug:usb:
    desc: "Dump USB host state, SIE registers, and USB log lines (-- --wait N | --follow [--for N])"
    silent: true
    cmds:
      - mkdir -p .scratch/debug/logs
      - |
        TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
        LOG=".scratch/debug/logs/${TS}-usb.log"
        FULL=".scratch/debug/logs/${TS}-usb-full.log"
        DO_FOLLOW=false; WAIT=0; FOR=""
        set -- {{.CLI_ARGS}}
        while [ $# -gt 0 ]; do
          case "$1" in
            --follow) DO_FOLLOW=true ;;
            --wait)   WAIT="$2"; shift ;;
            --for)    FOR="--for $2"; shift ;;
          esac
          shift
        done
        if [ "$WAIT" != "0" ]; then
          echo "waiting ${WAIT}s (plug the hub/drive now)..."
          sleep "$WAIT"
        fi
        {
          echo "=== debug:usb $(date -Iseconds) ==="
          echo ""
          echo "=== USB host state (D_USB) ==="
          uv run --quiet --with python-rtmidi python tools/device/fm1log.py --usb 2>&1
          echo ""
          echo "=== device status ==="
          uv run --quiet --with python-rtmidi python tools/device/fm1log.py --hello 2>&1
          echo ""
          echo "=== USB log lines ==="
          if [ "$DO_FOLLOW" = "true" ]; then
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py --follow $FOR 2>&1
          else
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py 2>&1 | tee "$FULL" \
              | grep -iE 'usb|otg|hub|enum|msc|udisk|vbus|host|routing|sense|csw|inq|lun|usbnet|dhcp|net:'
            echo "(unfiltered ring: $FULL)"
          fi
        } | tee "$LOG"
        ln -sf "logs/${TS}-usb.log" .scratch/debug/usb.log
        echo "Log saved: .scratch/debug/logs/${TS}-usb.log"

  debug:usb:host:
    desc: "Enumerate the USB tree as this computer sees it (plug the dock in here) and diff it against the newest FM-1 usb log"
    silent: true
    cmds:
      - mkdir -p .scratch/debug/logs
      - |
        TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
        LOG=".scratch/debug/logs/${TS}-usb-host.log"
        FM1=""
        case " {{.CLI_ARGS}} " in *" --fm1 "*) ;; *)
          LATEST="$(ls -t .scratch/debug/logs/*-usb-full.log 2>/dev/null | head -1)"
          [ -n "$LATEST" ] && FM1="--fm1 $LATEST" ;;
        esac
        python3 .scratch/tools/host-usb-test/host-usb-test.py $FM1 {{.CLI_ARGS}} 2>&1 | tee "$LOG"
        ln -sf "logs/${TS}-usb-host.log" .scratch/debug/usb-host.log
        echo "Log saved: .scratch/debug/logs/${TS}-usb-host.log"

  dock:modules:
    desc: "Collect fm1-dock's prebuilt .dock modules for a USB disk / SD card (task dock:modules -- /path/to/disk; default build/dock)"
    deps: [vendor:ensure]
    vars:
      DEST: '{{default "build/dock" .CLI_ARGS}}'
    cmds:
      - mkdir -p '{{.DEST}}'
      - cp firmware/upstream/fm1-dock/docs/modules/*.dock '{{.DEST}}/'
      - ls -la '{{.DEST}}'
      - 'echo "copy these to the disk root; modd lists them by the name in their header, 8.3 aliases are fine"'

  settings:reset:
    desc: Reset FM-1 settings to defaults (erases saved settings, device reboots)
    silent: true
    cmds:
      - uv run --quiet --group flash python tools/device/fm1_settings_reset.py {{.CLI_ARGS}}

  docs:
    desc: Regenerate all generated documentation
    cmds:
      - task: docs:module-diagram
      - task: docs:themes

  docs:module-diagram:
    desc: Regenerate the module dependency diagram in docs/COMPONENTS.md
    sources:
      - kconf/*.kconfig
    cmds:
      - uv run --quiet kc2mm inject docs/COMPONENTS.md --kconf-dir kconf

  docs:themes:
    desc: Regenerate all shell documentation (controls, diagrams, screenshots)
    cmds:
      - task: docs:themes:controls
      - task: docs:themes:ui:diagram
      - task: docs:themes:ui:screenshots

  docs:themes:controls:
    desc: Regenerate physical controls reference in docs/ui/README.md
    sources:
      - firmware/adapters/modd_controls.h
      - tools/codegen/gen_ui_map.py
    cmds:
      - uv run --quiet python tools/codegen/gen_ui_map.py hw-controls docs/ui/README.md

  docs:themes:ui:diagram:
    desc: Regenerate UI navigation diagrams and controls tables for all themes
    vars:
      THEMES:
        sh: uv run --quiet python tools/codegen/gen_ui_map.py list-shells
    cmds:
      - for: { var: THEMES }
        cmd: uv run --quiet python tools/codegen/gen_ui_map.py inject docs/ui/shells/{{.ITEM}}/UI.md {{.ITEM}}

  docs:themes:ui:screenshots:
    desc: Capture per-page emulator screenshots for all themes
    cmds:
      - uv run --quiet python tools/codegen/gen_ui_screenshots.py --all {{.CLI_ARGS}}

  docs:check:
    desc: Verify generated docs match their sources (for CI)
    vars:
      THEMES:
        sh: uv run --quiet python tools/codegen/gen_ui_map.py list-shells
    cmds:
      - uv run --quiet kc2mm inject --check docs/COMPONENTS.md --kconf-dir kconf
      - uv run --quiet python tools/codegen/gen_ui_map.py hw-controls --check docs/ui/README.md
      - for: { var: THEMES }
        cmd: uv run --quiet python tools/codegen/gen_ui_map.py inject --check docs/ui/shells/{{.ITEM}}/UI.md {{.ITEM}}

  config:
    desc: "Configure the build (default: menuconfig)"
    cmds:
      - task: config:menuconfig

  config:menuconfig:
    desc: Run menuconfig (ncurses) to configure the build
    cmds:
      - uv run --quiet python tools/build/menuconfig.py

  config:generate:
    desc: "Generate build/<defconfig>/gen/config.h (default: from current .config)"
    cmds:
      - task: config:generate:local

  config:generate:local:
    desc: Generate build/modd/gen/config.h from current .config
    cmds:
      - uv run --quiet python tools/build/genconfig.py

  config:generate:defconfig:
    desc: Load a named defconfig and generate config.h (e.g. task config:generate:defconfig -- melodee)
    cmds:
      - uv run --quiet python tools/build/genconfig.py --defconfig {{.CLI_ARGS}}
