version: '3'

dotenv: ['.env']

includes:
  fm1-platform:
    taskfile: https://raw.githubusercontent.com/DimmKirr/setup-fm1-toolchain/v1/Taskfile.yml
  fm1-emulator:
    taskfile: https://raw.githubusercontent.com/DimmKirr/setup-fm1-emulator/v1/Taskfile.yml
    vars:
      FM1_VERSION: v0.3.0
      FM1_SOURCE_REPO: DimmKirr/fm1-emu
  debug:wifi:
    taskfile: .scratch/Taskfile.yml
    optional: true
    dir: '{{.ROOT_DIR}}'

tasks:
  build:
    desc: Generate config.h and compile firmware (skipped when sources and .env are unchanged; --force to rebuild)
    deps: [fm1-platform:download:sdk, fm1-platform:download:toolchain, vendor:ensure]
    env:
      JIELI_TOOLCHAIN: '{{env "JIELI_TOOLCHAIN" | default (printf "%s/.fm1-toolchain/toolchain" .HOME)}}'
      AC79_SDK: '{{env "AC79_SDK" | default (printf "%s/.fm1-toolchain/AC79_SDK" .HOME)}}'
      ALLOW_NONFREE: '{{env "ALLOW_NONFREE" | default ""}}'
    sources:
      - firmware/**/*
      - tools/build/build.py
      - tools/build/genconfig.py
      - tools/codegen/logo_convert.py
      - tools/codegen/gen_engine_tables.py
      - kconf/**/*
      - configs/**/*
      - assets/**/*
      - Kconfig
      - .config
      - .env
    generates:
      - build/modd.fwsc
    method: checksum
    cmds:
      - uv run --quiet python tools/build/build.py {{.CLI_ARGS}}

  build:dry-run:
    desc: Show what would be compiled without building
    cmds:
      - uv run --quiet python tools/build/build.py --dry-run

  vendor:ensure:
    desc: "Fetch firmware/upstream/* and firmware/vendor/* at the commits in vendir.lock.yml when missing (the trees are not committed)"
    status:
      - uv run --quiet python tools/build/vendor.py present
    cmds:
      - vendir sync --locked

  vendor:sync:
    desc: "Re-resolve the pins in vendir.yml: rewrite the trees and vendir.lock.yml (one tree: -- --directory <path>)"
    cmds:
      - vendir sync {{.CLI_ARGS}}

  test:
    desc: Run all tests (unit + e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run Python unit tests (genconfig, defconfigs, tooling)
    deps: [vendor:ensure]
    cmds:
      - uv run --quiet python -m pytest tests/ -v --ignore-glob="tests/e2e_*"

  test:e2e:
    desc: Run E2E tests via fm1-emu emulator + Playwright
    deps:
      - task: build
        vars:
          CLI_ARGS: ''
      - fm1-emulator:download:wasm
    env:
      FM1_WEB_DIR: '{{env "FM1_WEB_DIR" | default (printf "%s/.fm1-emulator/web" .HOME)}}'
      PLAYWRIGHT_BROWSERS_PATH: '{{env "PLAYWRIGHT_BROWSERS_PATH" | default (printf "%s/.cache/ms-playwright" .HOME)}}'
    cmds:
      - uv run --quiet python -m pytest tests/e2e_boot_test.py tests/e2e_components_test.py tests/e2e_usb_safety_test.py tests/e2e_audio_test.py tests/e2e_audio_engines_test.py tests/e2e_ble_test.py tests/e2e_weather_test.py -v {{.CLI_ARGS}}

  emulator:build:
    desc: Build WASM from a local fm1-emu checkout (requires the Rust WASM target)
    requires:
      vars: [EMU_SOURCE]
    preconditions:
      - test -f '{{.EMU_SOURCE}}/web/build.sh'
    cmds:
      - bash '{{.EMU_SOURCE}}/web/build.sh' '{{.HOME}}/.fm1-emulator/web'

  flash:
    desc: "Build if needed, then flash firmware to FM-1 (default: USB-MIDI SysEx)"
    cmds:
      - task: flash:midi
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
          FIRMWARE: '{{.FIRMWARE | default ""}}'
          AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'

  flash:midi:
    desc: Flash firmware to FM-1 over USB-MIDI SysEx
    silent: true
    deps:
      - task: build
        vars: { CLI_ARGS: '' }   # flash's own -- args are for fm1_install.py, not build.py
    vars:
      FIRMWARE: '{{.FIRMWARE | default "build/modd.fwsc"}}'
      DEBUG: '{{.DEBUG | default "true"}}'
      AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found."
    cmds:
      - cmd: |
          test -f build/modd.version && echo "version: $(cat build/modd.version)" || true
      - task: build:size-check
      - uv run --quiet --group flash python tools/device/fm1_install.py {{.FIRMWARE}} --force {{if eq .AUTO_APPROVE "true"}}--yes {{end}}{{.CLI_ARGS}}

  build:size-check:
    desc: Show RAM and flash usage from linker map
    silent: true
    preconditions:
      - sh: test -f build/modd.map
        msg: "build/modd.map not found. Run 'task build' first."
    cmds:
      - cmd: |
          MAP=build/modd.map
          ELF=build/modd.elf
          FWSC=build/modd.fwsc
          # flash (XIP): body size vs 0x8C000 (573440)
          TEXT_SZ=$(stat -f%z build/text.bin 2>/dev/null || stat -c%s build/text.bin 2>/dev/null)
          FLASH_MAX=573440
          FLASH_PCT=$((TEXT_SZ * 100 / FLASH_MAX))
          # RAM (.data+.bss): 96K = 98304
          BSS_END=$(grep '_bss_end' "$MAP" | head -1 | awk '{print $1}')
          RAM_BASE=0x01C08000
          RAM_MAX=98304
          RAM_USED=$(( BSS_END - RAM_BASE ))
          RAM_PCT=$((RAM_USED * 100 / RAM_MAX))
          # POOL (.pool+stacks+audio): 0x54000 = 344064
          POOL_END=$(grep '_pool_end' "$MAP" | head -1 | awk '{print $1}')
          POOL_BASE=0x01C20000
          POOL_MAX=344064
          POOL_USED=$(( POOL_END - POOL_BASE ))
          POOL_PCT=$((POOL_USED * 100 / POOL_MAX))
          # NOINIT: 0x3D30 = 15664
          NOINIT_END=$(grep '_noinit_end' "$MAP" | head -1 | awk '{print $1}')
          NOINIT_BASE=0x01C7C020
          NOINIT_MAX=15664
          NOINIT_USED=$(( NOINIT_END - NOINIT_BASE ))
          NOINIT_PCT=$((NOINIT_USED * 100 / NOINIT_MAX))
          # fwsc package
          FWSC_SZ=$(stat -f%z "$FWSC" 2>/dev/null || stat -c%s "$FWSC" 2>/dev/null)
          printf "flash:  %6d / %6d (%2d%%)  XIP text\n" "$TEXT_SZ" "$FLASH_MAX" "$FLASH_PCT"
          printf "ram:    %6d / %6d (%2d%%)  .data+.bss\n" "$RAM_USED" "$RAM_MAX" "$RAM_PCT"
          printf "pool:   %6d / %6d (%2d%%)  .pool+audio+stacks\n" "$POOL_USED" "$POOL_MAX" "$POOL_PCT"
          printf "noinit: %6d / %6d (%2d%%)  debug ring+crash\n" "$NOINIT_USED" "$NOINIT_MAX" "$NOINIT_PCT"
          printf "fwsc:   %6d bytes (lz4 package)\n" "$FWSC_SZ"
      # What fills the 96 KB RAM region, largest first (tools/debug/ram_top.py); `task build:size-top -- -n 40` for more
      - uv run --quiet python tools/debug/ram_top.py build/modd.map -n 12

  build:size-top:
    desc: Rank the .data/.bss consumers from the linker map (default top 20; -- -n N)
    silent: true
    preconditions:
      - sh: test -f build/modd.map
        msg: "build/modd.map not found. Run 'task build' first."
    cmds:
      - uv run --quiet python tools/debug/ram_top.py build/modd.map {{.CLI_ARGS}}

  flash:uboot:
    desc: Flash firmware via UBOOT mode (hold OCT+/- for 5s, then run this)
    silent: true
    vars:
      FIRMWARE: '{{.FIRMWARE | default "build/modd.fwsc"}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found. Run 'task build' first."
    cmds:
      - cmd: |
          test -f build/modd.version && echo "version: $(cat build/modd.version)" || true
      - uv sync --quiet --group uboot
      - sudo uv run --quiet --group uboot python tools/device/fm1_uboot_flash.py {{.FIRMWARE}} {{.CLI_ARGS}}

  debug:flash:
    desc: Debug flash issues - list MIDI devices and retry update loader detection
    cmds:
      - cmd: |
          echo "=== MIDI devices ==="
          uv run --quiet --group flash python -c "
          import rtmidi
          mi = rtmidi.MidiIn()
          mo = rtmidi.MidiOut()
          print('IN: ', mi.get_ports())
          print('OUT:', mo.get_ports())
          "
          echo ""
          echo "=== Looking for FM-1 or Update Loader (10s) ==="
          uv run --quiet --group flash python -c "
          import rtmidi, time
          for i in range(20):
              mi = rtmidi.MidiIn()
              ports = mi.get_ports()
              for p in ports:
                  if 'FM-1' in p or 'Felucca' in p or 'Update' in p:
                      print(f'  found: {p}')
              if not any('FM-1' in p or 'Felucca' in p or 'Update' in p for p in ports):
                  print(f'  [{i*0.5:.1f}s] no FM-1 device')
              time.sleep(0.5)
          "
          echo ""
          echo "If 'Felucca Update' appeared, run: task flash"
          echo "If only 'FM-1' appeared, the device is in normal mode."
          echo "If nothing appeared, check USB cable."

  recover:download-stock-firmware:
    desc: Download official M-VAVE FM-1 stock firmware V15 (.fwsc)
    vars:
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    status:
      - test -f '{{.STOCK_FWSC}}'
    cmds:
      - mkdir -p build
      - curl -fL -o '{{.STOCK_FWSC}}' https://github.com/m-vave/fm1_open/raw/main/sdk/firmware/FM-1_015.fwsc
      - echo "Downloaded stock V15 firmware to {{.STOCK_FWSC}}"

  recover:transporter:rpi:flash:
    desc: Flash Transporter firmware onto a Raspberry Pi Pico (hold BOOTSEL, plug in, then run this)
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py setup --board pico_rp2040
      - uv run --quiet --group unbrick python fm1_transporter_recover.py flash-board --board pico_rp2040 {{.CLI_ARGS}}

  recover:transporter:fm1:unbrick:
    desc: Recover a hard-bricked FM-1 via Transporter (Pico wired to FM-1, no USB presence)
    deps: [recover:download-stock-firmware]
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py recover --board pico_rp2040 --v15 '{{.STOCK_FWSC}}' '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  recover:transporter:fm1:unbrick-soft:
    desc: Restore firmware via USB ROM boot mode (soft-bricked device)
    deps: [recover:download-stock-firmware]
    vars:
      UNBRICKER_DIR: '{{env "UNBRICKER_DIR" | default (printf "%s/.fm1-toolchain/unbricker" .HOME)}}'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    cmds:
      - |
        if [ ! -d "{{.UNBRICKER_DIR}}" ]; then
          echo "Cloning MvaveFM1Unbricker..."
          git clone --depth 1 https://github.com/Quixotic7/MvaveFM1Unbricker "{{.UNBRICKER_DIR}}"
        fi
      - uv run --quiet --group unbrick python "{{.UNBRICKER_DIR}}/fm1_unbrick.py" restore '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  # ---- Device debug tasks --------------------------------------------------
  # Each run saves to .scratch/debug/logs/<timestamp>-<name>.log with a
  # symlink at .scratch/debug/<name>.log. All talk to the FM-1 over
  # USB-MIDI SysEx (python-rtmidi). Specialized tasks (wl0, sweep, ind,
  # input) live in .scratch/Taskfile.yml under the debug:wifi: namespace.

  logs:debug:
    desc: "Dump build facts, crash record, log ring, and keep tailing (-- --no-follow to stop after dump)"
    silent: true
    cmds:
      - mkdir -p .scratch/debug/logs
      - |
        TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
        LOG=".scratch/debug/logs/${TS}-debug.log"
        NO_FOLLOW=false
        for arg in {{.CLI_ARGS}}; do
          [ "$arg" = "--no-follow" ] && NO_FOLLOW=true
        done
        {
          echo "=== logs:debug $(date -Iseconds) ==="
          echo "=== config.h symbols ==="
          grep '^#define CONFIG_' build/gen/config.h 2>/dev/null
          echo ""
          echo "=== .bss/.pool sizes (from linker map) ==="
          grep -E '^\.(bss|pool)\b|_bss_(start|end)|_pool_(start|end)' build/modd.map 2>/dev/null
          echo ""
          echo "=== firmware size ==="
          ls -la build/modd.fwsc build/modd.elf 2>/dev/null
          echo ""
          echo "=== device status (crash record, ring position) ==="
          uv run --quiet --with python-rtmidi python tools/device/fm1log.py --hello 2>&1
          echo ""
          echo "=== DAP log buffer ==="
          if [ "$NO_FOLLOW" = "true" ]; then
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py 2>&1
          else
            uv run --quiet --with python-rtmidi python tools/device/fm1log.py --follow 2>&1
          fi
        } | tee "$LOG"
        ln -sf "logs/${TS}-debug.log" .scratch/debug/debug.log

  settings:reset:
    desc: Reset FM-1 settings to defaults (erases saved settings, device reboots)
    silent: true
    cmds:
      - uv run --quiet --group flash python tools/device/fm1_settings_reset.py {{.CLI_ARGS}}

  docs:
    desc: Regenerate all generated documentation
    cmds:
      - task: docs:module-diagram

  docs:module-diagram:
    desc: Regenerate the module dependency diagram in docs/COMPONENTS.md
    sources:
      - kconf/*.kconfig
    cmds:
      - uv run --quiet kc2mm inject docs/COMPONENTS.md --kconf-dir kconf

  docs:check:
    desc: Verify generated docs match their sources (for CI)
    cmds:
      - uv run --quiet kc2mm inject --check docs/COMPONENTS.md --kconf-dir kconf

  config:
    desc: "Configure the build (default: menuconfig)"
    cmds:
      - task: config:menuconfig

  config:menuconfig:
    desc: Run menuconfig (ncurses) to configure the build
    cmds:
      - uv run --quiet python tools/build/menuconfig.py

  config:generate:
    desc: "Generate build/gen/config.h (default: from current .config)"
    cmds:
      - task: config:generate:local

  config:generate:local:
    desc: Generate build/gen/config.h from current .config
    cmds:
      - uv run --quiet python tools/build/genconfig.py

  config:generate:defconfig:
    desc: Load a named defconfig and generate config.h (e.g. task config:generate:defconfig -- melodee)
    cmds:
      - uv run --quiet python tools/build/genconfig.py --defconfig {{.CLI_ARGS}}
