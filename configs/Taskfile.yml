# Per-defconfig build, test, and flash tasks for modd.
# Included from the root Taskfile under the `modd:` namespace, so tasks here
# are invoked as `task modd:build:modd`, `task modd:test:modd_emu`, etc.
#
# Each defconfig in this directory gets build and flash tasks (modd_emu also gets the API tests;
# the production modd build has no CONFIG_RPC_INPUT, so the panel tests cannot run on it):
#   build:<name>   - build firmware -> build/<name>/modd.fwsc
#   flash:<name>   - flash the built firmware over USB-MIDI
#
# API tests run against fm1-live with --forward (screenshots + assertions):
#   test:<name>:api  - build, boot fm1-live, run API smoke, save screenshots
version: '3'

env:
  # Same default as the root Taskfile: JieLi unless USE_OPEN_TOOLCHAIN=1.
  # Emulator tasks ask for the open toolchain by passing OPEN to the root build:live.
  USE_OPEN_TOOLCHAIN: '{{.USE_OPEN}}'

vars:
  # Hardware builds use JieLi by default; USE_OPEN_TOOLCHAIN=1 selects the open
  # toolchain and build/<defconfig>-open/. Emulator tasks override to open below.
  USE_OPEN: '{{if eq (env "USE_OPEN_TOOLCHAIN") "1"}}1{{else}}0{{end}}'
  TC_SUFFIX: '{{if eq .USE_OPEN "1"}}-open{{end}}'
  FM1_EMU_ROOT: '{{env "FM1_EMU_ROOT" | default "/Users/dmitry/dev/modd-fm/fm1-emu/.worktrees/master"}}'
  FM1_LIVE: '{{env "FM1_LIVE" | default (printf "%s/target/release/fm1-live" .FM1_EMU_ROOT)}}'

tasks:
  _build:
    internal: true
    # The root build:live does the work, so `task modd:build:<name>` and
    # `task build -- --defconfig <name>` share one checksum per defconfig and
    # rebuild when the sources changed, not only when the package is missing.
    # OPEN (1 or 0, optional) is the toolchain for this build; without it the shell's
    # USE_OPEN_TOOLCHAIN decides.
    vars:
      DEFCONFIG: '{{.DEFCONFIG}}'
    cmds:
      - task: :build:live
        vars: { CLI_ARGS: '--defconfig {{.DEFCONFIG}}', OPEN: '{{.OPEN}}' }

  _flash:
    internal: true
    vars:
      DEFCONFIG: '{{.DEFCONFIG}}'
      FWSC: 'build/{{.DEFCONFIG}}{{.TC_SUFFIX}}/modd.fwsc'
    preconditions:
      - sh: 'test "$USE_OPEN_TOOLCHAIN" != 1 || test "$OPEN_TOOLCHAIN_FLASH_OK" = 1 || test "{{.OPEN_TOOLCHAIN_FLASH_OK}}" = 1'
        msg: "This image is built with the open pi32v2 toolchain, which is not verified on hardware. To flash it on purpose set OPEN_TOOLCHAIN_FLASH_OK=1. To build with JieLi (the default) omit USE_OPEN_TOOLCHAIN or set it to 0."
      - sh: test -f '{{.FWSC}}'
        msg: '{{.FWSC}} not found. Build it first: task modd:build:{{.DEFCONFIG}}'
    cmds:
      - cmd: '{{if .TC_SUFFIX}}echo "WARNING: flashing an image built with the open pi32v2 toolchain (not hardware-verified)."{{else}}:{{end}}'
        silent: true
      - uv run --quiet --group flash python tools/device/fm1_install.py '{{.FWSC}}' --force --yes {{.CLI_ARGS}}

  _test:api:
    internal: true
    desc: "Build firmware, run the direct-API tests: Python drives the firmware over HTTP in fm1-live"
    vars:
      DEFCONFIG: '{{.DEFCONFIG}}'
      _SUFFIX: '{{.TC_SUFFIX_OVERRIDE | default .TC_SUFFIX}}'
      FWSC: 'build/{{.DEFCONFIG}}{{._SUFFIX}}/modd.fwsc'
      # Each test class boots its own fm1-live with a port forward (tests/api_fixtures.py), waits
      # for /api/info and stops it afterwards: no emulator process is left behind.
      TESTS: '{{.TESTS | default "tests/ui/shells/modd/api/"}}'
    # OPEN and TC_SUFFIX_OVERRIDE come as a pair: the package built is the package tested.
    deps:
      - task: _build
        vars: { DEFCONFIG: '{{.DEFCONFIG}}', OPEN: '{{.OPEN}}' }
    preconditions:
      - sh: test -f '{{.FM1_LIVE}}'
        msg: 'fm1-live not found at {{.FM1_LIVE}}. Build fm1-emu or set FM1_LIVE.'
    env:
      MODD_API_FWSC: '{{.ROOT_DIR}}/{{.FWSC}}'
      MODD_API_DEFCONFIG: '{{.DEFCONFIG}}'
      FM1_LIVE: '{{.FM1_LIVE}}'
      FM1_API_EMU_FLAGS: '{{.EMU_FLAGS}}'
      # fm1-live live mode needs a display (Xvfb :99 in CI/container)
      DISPLAY: '{{env "DISPLAY" | default ":99"}}'
    cmds:
      - uv run --quiet --group ui-test python -m pytest {{.TESTS}} -v {{.CLI_ARGS}}

  # --- modd (default) -------------------------------------------------------
  build:modd:
    desc: "Build modd defconfig (-> build/modd/modd.fwsc)"
    cmds:
      - task: _build
        vars: { DEFCONFIG: modd }

  flash:modd:
    desc: "Flash modd defconfig"
    cmds:
      - task: _flash
        vars: { DEFCONFIG: modd, CLI_ARGS: '{{.CLI_ARGS}}' }

  # --- modd_emu ---------------------------------------------------------
  # Emulator defconfigs default to the open toolchain (USE_OPEN_TOOLCHAIN=1).
  # Override with USE_OPEN_TOOLCHAIN=0 to build with JieLi.
  build:modd_emu:
    desc: "Build modd_emu defconfig (-> build/modd_emu-open/modd.fwsc)"
    dotenv: ['.env.emu']
    env:
      USE_OPEN_TOOLCHAIN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
    cmds:
      - task: _build
        vars: { DEFCONFIG: modd_emu, OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}' }

  test:modd_emu:api:
    desc: "Build modd_emu + run every API-tier test in fm1-live, then the USB safety test (test:usb_safety)"
    dotenv: ['.env.emu']
    env:
      USE_OPEN_TOOLCHAIN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
    vars:
      _EMU_SUFFIX: '{{if eq (env "USE_OPEN_TOOLCHAIN" | default "1") "1"}}-open{{end}}'
    # Step 1 needs only the modd_emu build (_test:api builds it). Step 2 builds modd and felucca,
    # so it runs after the tests: a concurrent build stalls the emulator on the 2-CPU quota.
    cmds:
      # Classes that pin DEFCONFIG = 'modd_felucca_emu' test that build: build it first (cached, one
      # at a time: two builds at once stall on the 2-CPU quota), or they would skip or run a stale image.
      - task: _build
        vars: { DEFCONFIG: modd_felucca_emu, OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}' }
      - task: _test:api
        vars:
          DEFCONFIG: modd_emu
          OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
          TC_SUFFIX_OVERRIDE: '{{._EMU_SUFFIX}}'
          # the API tier is chosen by is_api_test in tests/conftest.py, not by a list
          TESTS: 'tests/ --tier api'
          CLI_ARGS: '{{.CLI_ARGS}}'
      - task: test:usb_safety
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:usb_safety:
    desc: "Build modd_emu, modd and felucca, then run the USB safety test (scans their binaries for the UBOOT SysEx key)"
    # Builds all three with the caller's toolchain (the USB safety scan doesn't
    # care which compiler produced the binary). The FWSC path uses TC_SUFFIX so
    # it matches whichever build ran.
    deps:
      - task: _build
        vars: { DEFCONFIG: modd_emu }
      - task: _build
        vars: { DEFCONFIG: modd }
      - task: _build
        vars: { DEFCONFIG: felucca }
    preconditions:
      - sh: test -f '{{.FM1_LIVE}}'
        msg: 'fm1-live not found at {{.FM1_LIVE}}. Build fm1-emu or set FM1_LIVE.'
    vars:
      _SUFFIX: '{{if eq (env "USE_OPEN_TOOLCHAIN" | default "0") "1"}}-open{{end}}'
    env:
      MODD_API_FWSC: '{{.ROOT_DIR}}/build/modd_emu{{._SUFFIX}}/modd.fwsc'
      MODD_API_DEFCONFIG: modd_emu
      FM1_LIVE: '{{.FM1_LIVE}}'
      FM1_API_EMU_FLAGS: ''
      DISPLAY: '{{env "DISPLAY" | default ":99"}}'
    cmds:
      - uv run --quiet --group ui-test python -m pytest tests/usb/usb_otg_presence_safety_test.py -v {{.CLI_ARGS}}

  # --- modd_felucca (hardware) ---------------------------------------------
  build:modd_felucca:
    desc: "Build modd_felucca defconfig (-> build/modd_felucca/modd.fwsc)"
    cmds:
      - task: _build
        vars: { DEFCONFIG: modd_felucca }

  flash:modd_felucca:
    desc: "Build + flash modd_felucca defconfig"
    deps:
      - task: build:modd_felucca
    cmds:
      - task: _flash
        vars: { DEFCONFIG: modd_felucca, CLI_ARGS: '{{.CLI_ARGS}}' }

  # --- modd_felucca_emu ---------------------------------------------------
  build:modd_felucca_emu:
    desc: "Build modd_felucca_emu defconfig (-> build/modd_felucca_emu-open/modd.fwsc)"
    dotenv: ['.env.emu']
    env:
      USE_OPEN_TOOLCHAIN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
    cmds:
      - task: _build
        vars: { DEFCONFIG: modd_felucca_emu, OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}' }

  test:modd_felucca_emu:api:
    desc: "Build modd_felucca_emu + run the modd shell API tests against the Felucca audio stack"
    dotenv: ['.env.emu']
    env:
      USE_OPEN_TOOLCHAIN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
    vars:
      _EMU_SUFFIX: '{{if eq (env "USE_OPEN_TOOLCHAIN" | default "1") "1"}}-open{{end}}'
    cmds:
      - task: _test:api
        vars:
          DEFCONFIG: modd_felucca_emu
          OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
          TC_SUFFIX_OVERRIDE: '{{._EMU_SUFFIX}}'
          TESTS: 'tests/ui/shells/modd/api/'
          CLI_ARGS: '{{.CLI_ARGS}}'

  test:modd_emu:api:wifi:
    desc: "Build modd_emu + run the API tests with WiFi as the only link (fm1-live --wifi oss): pages, weather, WIFI off then on"
    dotenv: ['.env.emu']
    env:
      USE_OPEN_TOOLCHAIN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
    vars:
      _EMU_SUFFIX: '{{if eq (env "USE_OPEN_TOOLCHAIN" | default "1") "1"}}-open{{end}}'
    cmds:
      # Classes that pin DEFCONFIG = 'modd_felucca_emu' test that build: build it first (cached, one
      # at a time: two builds at once stall on the 2-CPU quota), or they would skip or run a stale image.
      - task: _build
        vars: { DEFCONFIG: modd_felucca_emu, OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}' }
      - task: _test:api
        vars:
          DEFCONFIG: modd_emu
          OPEN: '{{env "USE_OPEN_TOOLCHAIN" | default "1"}}'
          TC_SUFFIX_OVERRIDE: '{{._EMU_SUFFIX}}'
          EMU_FLAGS: '--wifi oss --net internet'
          # api_wifi_need_test.py: TestWifiOffOn runs, TestWifiEthernet skips (it needs --usb ethernet)
          TESTS: >-
            tests/ui/shells/modd/api/
            tests/net/api_weather_test.py
            tests/wifi/api_wifi_need_test.py
          CLI_ARGS: '{{.CLI_ARGS}}'
