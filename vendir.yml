# Vendored upstream source trees, managed by vendir (https://carvel.dev/vendir).
#
#   task vendor:sync    rewrite every `path` below from its pinned ref and
#                       record the resolved SHAs in vendir.lock.yml
#   task vendor:check   fail if the committed trees drift from the lock (CI)
#
# Never edit files under these paths. modd adapts upstream code through
# firmware/adapters/ and project-owned config headers (for example
# firmware/src/udisk/ffconf.h), never by patching the vendored tree.
# Provenance, licenses and what each tree is used for: THIRD_PARTY.md.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.40.0
directories:

# --- Community FM-1 firmwares (GPL-3.0 unless noted) ---------------------

- path: firmware/upstream/felucca
  contents:
  - path: .
    git:
      url: https://github.com/hugelton/Felucca
      ref: v1.8.2
    excludePaths: [".git/**"]

- path: firmware/upstream/felucca-engines
  contents:
  - path: .
    git:
      url: https://github.com/hugelton/Felucca-Engines
      # Felucca-Engines HEAD at the time of Felucca v1.8.2 (MIT-licensed engines).
      ref: d0260074ce100a47675814b7f38d61f11176c926
    excludePaths: [".git/**"]

- path: firmware/upstream/melodee
  contents:
  - path: .
    git:
      url: https://github.com/keremimo/melodee
      ref: v1.6.1
    excludePaths: [".git/**"]

- path: firmware/upstream/sloop
  contents:
  - path: .
    git:
      url: https://github.com/isod89/sloop-fm1
      ref: v2.8.5
    excludePaths: [".git/**"]

- path: firmware/upstream/fmlab
  contents:
  - path: .
    git:
      url: https://github.com/jsmith13/fm_lab
      ref: v1.4.0
    excludePaths: [".git/**"]

- path: firmware/upstream/fm1-dock
  contents:
  - path: .
    git:
      url: https://github.com/joakimeriksson/fm1-dock
      ref: v0.9.0
    excludePaths: [".git/**"]

- path: firmware/upstream/skiff
  contents:
  - path: .
    git:
      url: https://github.com/illuminus5/skiff
      ref: v2.7
    excludePaths: [".git/**"]

- path: firmware/upstream/optimist
  contents:
  - path: .
    git:
      url: https://github.com/w0ts/optimist
      ref: v0.4
    # fm1base submodule uses SSH URL (git@github.com:), skip it and the
    # third-party submodules; modd only needs the BLE source.
    excludePaths: [".git/**", "fm1base/**", "third_party/**"]

- path: firmware/upstream/jiant
  contents:
  - path: .
    git:
      url: https://github.com/juanjiant-bit/JIANT
      # No release tags; pin to latest commit (JIANT FM V10).
      ref: da8baa1eed7c4e75f1ed9bcf433797b3aeace107
    excludePaths: [".git/**"]

- path: firmware/upstream/fm1-base
  contents:
  - path: .
    git:
      url: https://github.com/charlesvestal/fm1-base
      # No release tags yet; pin to latest commit.
      ref: c8e05997ce970875038156d2bbd69e712eac1543
    excludePaths: [".git/**"]

# --- Third-party libraries -----------------------------------------------

- path: firmware/vendor/lwip
  contents:
  - path: .
    git:
      # Official GitHub mirror of https://git.savannah.nongnu.org/git/lwip.git
      url: https://github.com/lwip-tcpip/lwip
      # lwIP 2.2.1 release (commit 77dcd25a).
      ref: STABLE-2_2_1_RELEASE
    excludePaths: [".git/**"]

- path: firmware/vendor/fatfs
  contents:
  - path: .
    http:
      # FatFs R0.15 by ChaN. Project config lives in firmware/src/udisk/
      # (ffconf.h, diskio.h); only the pristine core is vendored.
      url: https://elm-chan.org/fsw/ff/arc/ff15.zip
      sha256: e0d76654d877e6c74be5ea3c395808794d495169514e98cbf6046168b8f4f070
    includePaths:
    - LICENSE.txt
    - source/00readme.txt
    - source/00history.txt
    - source/ff.c
    - source/ff.h

- path: firmware/vendor/lvgl
  contents:
  - path: .
    git:
      # LVGL 9.6.0 (MIT), the widget library behind the modd shell (CONFIG_UI_SHELL_MODD).
      # Project config: firmware/src/ui/shells/modd/lv_conf.h. Only the library
      # is taken here; its documentation is vendored below into docs/lvgl.
      url: https://github.com/lvgl/lvgl
      ref: v9.6.0
      depth: 1
    includePaths:
    - LICENCE.txt
    - lvgl.h
    - lvgl_private.h
    - lv_version.h
    - lv_conf_template.h
    - src/**/*
    - include/**/*

# --- Reference documentation (read, never built or shipped) ---------------

- path: docs/lvgl
  contents:
  - path: .
    git:
      # The LVGL 9.6.0 manual (docs/src/**/*.mdx) and the example sources its
      # pages show, from the same tag as firmware/vendor/lvgl. Read these when
      # writing LVGL code: the 8.x API differs and is not what modd builds.
      url: https://github.com/lvgl/lvgl
      ref: v9.6.0
      depth: 1
    includePaths:
    - LICENCE.txt
    - docs/**/*
    - examples/**/*.c
    - examples/**/*.h
    excludePaths:
    - examples/assets/**/*
