[project]
name = "modd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.65.0",
    "kconfiglib>=14.1.0",
    "pillow>=12.3.0",
    "skidl>=3.0.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "playwright>=1.50",
    "kconfig2mermaid>=0.1.0",
    "pycparser>=2.22",
]
flash = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
uboot = [
    "pyusb>=1.2",
]
unbrick = [
    "crcmod>=1.7",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "pycryptodomex>=3.20",
    "tqdm>=4.66",
]
ui-test = [
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4.0",
    "pillow>=12.3.0",
    "pytest>=8.0",
]

[project.scripts]

[tool.uv]
# rapidocr-onnxruntime depends on opencv-python (full, needs Qt5/X11/libGL).
# Replace it with the headless variant which has the same cv2 API but no GUI deps.
override-dependencies = [
    "opencv-python ; sys_platform == 'never'",
]

[tool.uv.sources]
kconfig2mermaid = { git = "https://github.com/DimmKirr/kconfig2mermaid", tag = "v0.1.0" }
# local development: kconfig2mermaid = { path = "../kconfig2mermaid", editable = true }

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the default list minus "build", so tests/build/ is collected
norecursedirs = [".*", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv"]
