name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Build once, test that package, and publish those exact bytes below.
    # Allow the reusable workflow's test job to request its declared permission.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      release_bundle: true
      firmware_version: ${{ github.ref_name }}

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested firmware bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.firmware_artifact_id }}
          path: dist
          merge-multiple: true

      - name: Download test results
        # Unit-test logs only: the API job (screenshots) does not run for release tags.
        if: ${{ needs.verify.outputs.results_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.results_artifact_id }}
          path: results
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s modd.fwsc
          test -s modd.config
          test -s modd-source.tar.gz
          test -s modd-licenses.tar.gz
          sha256sum -c SHA256SUMS

      - name: Create versioned firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes="$RUNNER_TEMP/release-notes.md"
          # Screenshots come from the API tests, which do not run for release tags: optional.
          screenshots=()
          if [[ -d results ]]; then
            mapfile -d '' screenshots < <(find results -type f -path '*/screenshots/*.png' -print0 | sort -z)
          fi

          {
            echo "# modd $tag"
            echo
            echo "Production modd firmware (defconfig modd, modd theme) built from commit $GITHUB_SHA."
            echo "Unit tests passed and the firmware built: [workflow run]($run_url)."
            echo
            echo 'This build has not been verified on hardware.'
            echo 'Assets include the tested .fwsc, the resolved modd configuration (modd.config), corresponding source, license notices, and SHA-256 checksums.'
            echo 'Test logs remain available in the run artifacts for 14 days.'
            if (( ${#screenshots[@]} > 0 )); then
              echo
              echo '## Emulator screenshots'
              echo
            fi
          } > "$notes"

          assets=(dist/modd.fwsc dist/modd.config dist/modd-source.tar.gz
                  dist/modd-licenses.tar.gz dist/SHA256SUMS)
          for screenshot in "${screenshots[@]}"; do
            asset_name="$(basename "$screenshot")"
            assets+=("$screenshot#$asset_name")
            printf '![%s](%s/%s/releases/download/%s/%s)\n\n' \
              "$asset_name" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" "$asset_name" >> "$notes"
          done

          # Preserve published releases on reruns. No deletion or asset replacement.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace published assets."
            exit 1
          fi
          # The current milestone is intentionally a prerelease, even for vX.Y.Z tags.
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "modd $tag" --notes-file "$notes" \
            --prerelease --latest=false
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
